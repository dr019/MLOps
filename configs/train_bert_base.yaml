data_train_csv: data/train.csv
data_text_col: text
data_label_col: target
data_val_size: 0.1
data_random_seed: 42

model_pretrained_name: bert-base-uncased
model_num_labels: 2
model_max_length: 128

train_output_dir: outputs/bert_base
train_num_train_epochs: 3
train_per_device_train_batch_size: 16
train_per_device_eval_batch_size: 32
train_learning_rate: 2e-5
train_weight_decay: 0.01
train_warmup_ratio: 0.1
train_logging_steps: 50
train_evaluation_strategy: steps
train_eval_steps: 200
train_save_strategy: steps
train_save_steps: 200
train_seed: 42
train_fp16: true
train_report_to: none
train_metric_for_best_model: f1
train_greater_is_better: true

api_threshold: 0.5